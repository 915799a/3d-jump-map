  wv=wa?Math.sin(T0*.9)*wa*.35:0;P.x+=wv*dt;
  const wd=$('wind');if(wa){const sr=wv*Math.cos(yaw),n=Math.min(3,Math.ceil(Math.abs(sr)/2));wd.textContent=n?(sr>0?'→ 돌풍 ':'← 돌풍 ')+(sr>0?'»':'«').repeat(n):'돌풍 잠잠';wd.style.display='block'}else wd.style.display='none';
  P.vy=Math.max(P.vy+G*gs*dt,-35);
  const pg=P.g,py=P.y;let q;
  P.x+=P.vx*dt;if(q=hit()){P.x=P.vx>0?q.m.position.x-q.w/2-.401:q.m.position.x+q.w/2+.401;P.vx=0}
  P.z+=P.vz*dt;if(q=hit()){P.z=P.vz>0?q.m.position.z-q.d/2-.401:q.m.position.z+q.d/2+.401;P.vz=0}
  P.y+=P.vy*dt;P.g=null;
  for(const q of plats){if(!q.on)continue;const m=q.m.position;
    if(Math.abs(P.x-m.x)<q.w/2+.4&&Math.abs(P.z-m.z)<q.d/2+.4){
      const top=m.y+q.h/2,bot=m.y-q.h/2;
      if(P.vy<=0&&py>=top-.08&&P.y<=top){P.y=top;P.vy=0;P.g=q}
      else if(P.vy>0&&py+1.8<=bot+.08&&P.y+1.8>=bot){P.y=bot-1.8;P.vy=0}
    }}
  if(P.g&&P.g!==pg)onLand(P.g);
  for(const s of spins){
    const dx=P.x-s.x,dz=P.z-s.z,c=Math.cos(s.a),n=Math.sin(s.a),lx=dx*c-dz*n,lz=dx*n+dz*c,by=s.m.position.y;
    if(Math.abs(lx)<s.len/2+.3&&Math.abs(lz)<.55&&P.y<by+.4&&P.y+1.8>by-.4){die();break}
  }
  for(const k of hz){const m=k.m.position;if(Math.abs(P.x-m.x)<k.w/2+.3&&Math.abs(P.z-m.z)<k.d/2+.3&&P.y<m.y+k.h/2&&P.y+1.7>m.y-k.h/2){die();break}}
  if(P.y<cps[curCp].y-22)die();
  $('tm').textContent=fmt(tt);
}
function draw(dt){
  hero.position.set(P.x,P.y,P.z);const sq=cl(P.vy/35,-.3,.3)*.4,spd=cl(Math.hypot(P.vx,P.vz)/4,0,1);hero.scale.set(1-sq*.5,1+sq,1-sq*.5);legs.forEach((l,i)=>{l.position.z=P.g?Math.sin(T0*14+i*PI)*.22*spd:(i?.18:-.18)});animHero(spd);
  const d=((P.face-hero.rotation.y+PI)%(2*PI)+2*PI)%(2*PI)-PI;hero.rotation.y+=d*Math.min(1,dt*14);
  let st=-1e9;
  for(const q of plats){if(!q.on)continue;const m=q.m.position;
    if(Math.abs(P.x-m.x)<q.w/2&&Math.abs(P.z-m.z)<q.d/2){const tp=m.y+q.h/2;if(tp<=P.y+.05&&tp>st)st=tp}}
  shadow.visible=st>-1e8;shadow.position.set(P.x,st+.02,P.z);shadow.scale.setScalar(cl(1-(P.y-st)/12,.4,1));
  yaw+=((keys.KeyE?1:0)-(keys.KeyQ?1:0))*dt*2;
  const k=1-Math.exp(-dt*8);look.x+=(P.x-look.x)*k;look.y+=(P.y+1.2-look.y)*k;look.z+=(P.z-look.z)*k;
  const dist=9,cp=Math.cos(pitch);
  cam.position.set(look.x+Math.sin(yaw)*cp*dist,look.y+Math.sin(pitch)*dist,look.z+Math.cos(yaw)*cp*dist);
  cam.lookAt(look.x,look.y,look.z);stars.position.copy(cam.position);fx(dt);
  wmat.opacity+=((wv?Math.min(.7,Math.abs(wv)/5):0)-wmat.opacity)*Math.min(1,dt*5);
  if(wmat.opacity>.02)for(const m of wps){m.position.x=P.x+((((m.position.x+wv*2.2*dt-P.x+25)%50)+50)%50)-25;if(Math.abs(m.position.z-P.z)>25)m.position.z=P.z+(Math.random()-.5)*50;if(Math.abs(m.position.y-P.y-4)>9)m.position.y=P.y+Math.random()*9}
  ipT-=dt;
  if(P.g&&P.g.ice&&Math.hypot(P.vx,P.vz)>2&&ipT<=0){ipT=.05;const q=ip[ipI++%ip.length];q.l=.45;q.vx=-P.vx*.25+(Math.random()-.5);q.vz=-P.vz*.25+(Math.random()-.5);q.m.position.set(P.x,P.y+.1,P.z);q.m.visible=true}
  for(const q of ip)if(q.l>0){q.l-=dt;q.m.position.x+=q.vx*dt;q.m.position.z+=q.vz*dt;q.m.position.y+=dt*1.2;q.m.material.opacity=Math.max(0,q.l/.45);if(q.l<=0)q.m.visible=false}
}
reset();
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.033);last=now;T0+=dt;
  upd(T0,dt);if(run)step(dt);draw(dt);R.render(S,cam);
}
requestAnimationFrame(loop);
</script>
